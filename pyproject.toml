[project]
name = "whistledrop-ai"
version = "0.1.0"
description = "Anonymous reporting and intelligent case triage system"
requires-python = ">=3.12,<3.13"

# Dependencies are managed in requirements.txt / requirements-dev.txt.
# This file carries tooling configuration only.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require a running PostgreSQL container",
]

[tool.coverage.run]
source = ["app", "ml/src", "scripts"]
branch = true
omit = [
    # Generated by Alembic and executed by it, not by the application.
    "alembic/*",
    # The synthetic data generator is a development tool; its output is what
    # matters and that is tested directly.
    "ml/src/generate_synthetic.py",
    # The end-to-end demonstration is itself a smoke test: it drives a running
    # server and exits non-zero if any check fails. Measuring it under pytest
    # would report 0% for a script that is verified by being run.
    "scripts/demo.py",
]

[tool.coverage.report]
# Not a gate. Coverage here is a map of what the tests reach, read by a person
# deciding where to look next — a threshold would only invite tests written to
# satisfy it. The critical paths are covered deliberately, and the numbers are
# in docs/COVERAGE.md.
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit security checks
]
ignore = [
    "S101",  # assert is expected in tests
]

[tool.ruff.lint.isort]
# The alembic/ script directory at the repo root makes Ruff mistake the
# `alembic` library for first-party code. It is a dependency.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test fixtures may contain dummy credentials
