# Alembic configuration.
#
# sqlalchemy.url is deliberately left blank: the DSN is a secret and is
# resolved at runtime by alembic/env.py from the application settings (or from
# ALEMBIC_DATABASE_URL / -x db_url for the test database). Nothing
# credential-bearing belongs in a tracked file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Migration filenames are prefixed with a UTC timestamp so they sort in the
# order they were written, independent of the revision hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

sqlalchemy.url =


[post_write_hooks]
# ruff ships as a standalone binary, so it is invoked as an executable
# rather than through a console_scripts entry point.
hooks = ruff_format, ruff_lint
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
