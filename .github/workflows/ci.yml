name: CI

# The same four checks the project is verified with locally: Ruff lint, Ruff
# format, the full pytest suite against a real PostgreSQL, and `alembic check`.
on:
  push:
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A push to a branch with an open pull request would otherwise run this twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests and migrations
    runs-on: ubuntu-latest

    # PostgreSQL 16, matching docker-compose.yml. The suite runs against a real
    # database by design and never SQLite, so this service is not optional: if
    # it were missing the integration tests would *skip*, and a green run would
    # hide most of the suite. The step after pytest fails the job if that
    # happens.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whistledrop
          POSTGRES_PASSWORD: ci-postgres-password-not-a-real-secret
          POSTGRES_DB: whistledrop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whistledrop -d whistledrop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI values. Every one is visibly fake and none is a credential
      # for anything that exists: this database lives for the length of the job
      # and is reachable only from it. The pepper and signing key are only long
      # enough to clear the 32-character floor `Settings` enforces, and both
      # differ from the placeholders in .env.example, which `Settings` rejects
      # outright. The real values live in .env, which is gitignored and never
      # reaches CI.
      POSTGRES_PASSWORD: ci-postgres-password-not-a-real-secret
      DATABASE_URL: postgresql+psycopg://whistledrop:ci-postgres-password-not-a-real-secret@localhost:5432/whistledrop
      # A *different* database from DATABASE_URL, with a name ending in `_test`.
      # tests/conftest.py refuses to run if either of those is untrue.
      TEST_DATABASE_URL: postgresql+psycopg://whistledrop:ci-postgres-password-not-a-real-secret@localhost:5432/whistledrop_test
      CASE_CODE_PEPPER: ci-only-case-code-pepper-not-a-real-secret
      JWT_SECRET_KEY: ci-only-jwt-signing-key-not-a-real-secret

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ml.txt

      - name: Install dependencies
        # requirements-ml.txt begins with `-r requirements.txt`, so this is
        # runtime + training + dev resolved together. The training
        # dependencies are needed because the suite trains and loads a real
        # model artifact.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Create the test database
        # The service container creates POSTGRES_DB and nothing else. The suite
        # needs a second, separate database — it rebuilds that one from the
        # migrations on every run, and refuses to touch the first.
        run: |
          python - <<'PY'
          import os

          import psycopg

          dsn = os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(dsn, autocommit=True) as connection:
              exists = connection.execute(
                  "SELECT 1 FROM pg_database WHERE datname = 'whistledrop_test'"
              ).fetchone()
              if not exists:
                  connection.execute("CREATE DATABASE whistledrop_test")
          print("whistledrop_test is ready")
          PY

      - name: Train the model artifact
        # ml/artifacts/ is gitignored: the model is a build output, reproducible
        # in about two seconds from the committed synthetic dataset and a fixed
        # seed. A clone therefore has to produce it, and the API-side triage
        # tests load this exact artifact — without it they fail.
        run: python -m ml.src.train_category

      - name: Run the test suite
        shell: bash
        # -rs lists skip reasons, which the next step inspects. pipefail keeps
        # pytest's exit code rather than tee's.
        run: |
          set -o pipefail
          python -m pytest -rs | tee pytest-output.txt

      - name: Fail if database-backed tests were skipped
        # conftest skips the entire integration suite when PostgreSQL is
        # unreachable. That is right for a laptop with no container running and
        # wrong for CI, where it would turn several hundred untested paths into
        # a green tick. The only skips expected here are the two tests that
        # cross-check a local .env, which does not exist in CI.
        run: |
          if grep -qE "PostgreSQL is not reachable|TEST_DATABASE_URL is not set" pytest-output.txt; then
            echo "::error::PostgreSQL-backed tests were skipped. CI must run them."
            exit 1
          fi

      - name: Migrations match the models
        # `alembic check` compares the models against a live schema, so the
        # database has to be at head first. This runs against DATABASE_URL,
        # which is a different database from the one the suite rebuilds.
        run: |
          python -m alembic upgrade head
          python -m alembic check
